      flex: 1;

  <script>
    const DEFAULT_MD = "# \u6d3b\u529b\u5750\u6807\uff08Vitality Coordinates\uff09\u5e97\u5185\u79fb\u52a8\u6536\u94f6\u7cfb\u7edf\n## \u4ea7\u54c1\u9700\u6c42\u6587\u6863 (PRD - Product Requirement Document)\n\n> **\u5f53\u524d\u7248\u672c**\uff1aV1.4  \n> **\u6587\u6863\u5bc6\u7ea7**\uff1a\u5185\u90e8\u4ea7\u54c1\u89c4\u8303  \n> **\u9762\u5411\u5bf9\u8c61**\uff1a\u4ea7\u54c1\u7ecf\u7406\u3001\u95e8\u5e97\u8fd0\u8425\u3001\u4e1a\u52a1\u7ba1\u7406\u5c42\u3001UI/UX \u8bbe\u8ba1\u5e08\u3001\u6d4b\u8bd5\u56e2\u961f\u3001\u5408\u89c4\u5ba1\u8ba1  \n> **\u9002\u7528\u7ec8\u7aef**\uff1aPDA \u667a\u80fd\u624b\u6301\u7ec8\u7aef / \u667a\u80fd\u624b\u673a / \u79fb\u52a8 POS \u6536\u94f6\u673a  \n> **\u5bf9\u5e94\u539f\u578b**\uff1a[\u624b\u673a\u7aef\u5e97\u5185\u6536\u94f6.html](file:///c:/\u6587\u4ef6/\u8c37\u6b4cAI/\u8001\u767e\u59d3/\u65b0\u5e97\u578b/\u624b\u673a\u7aef\u5e97\u5185\u6536\u94f6.html)\n\n---\n\n## \u76ee\u5f55\n1. [\u6587\u6863\u6982\u8ff0](#1-\u6587\u6863\u6982\u8ff0)\n2. [\u4e1a\u52a1\u6d41\u7a0b\u56fe](#2-\u4e1a\u52a1\u6d41\u7a0b\u56fe)\n3. [\u529f\u80fd\u89c4\u683c\u8be6\u8ff0](#3-\u529f\u80fd\u89c4\u683c\u8be6\u8ff0)\n   - 3.1 [\u5de5\u4f5c\u53f0\u521d\u59cb\u6001\u4e0e\u573a\u666f\u5b9a\u4f4d](#31-\u5de5\u4f5c\u53f0\u521d\u59cb\u6001\u4e0e\u573a\u666f\u5b9a\u4f4d)\n   - 3.2 [\u4f1a\u5458\u8eab\u4efd\u667a\u80fd\u8bc6\u522b\u4e0e\u80f6\u56ca\u4ea4\u4e92](#32-\u4f1a\u5458\u8eab\u4efd\u667a\u80fd\u8bc6\u522b\u4e0e\u80f6\u56ca\u4ea4\u4e92)\n   - 3.3 [\u836f\u54c1\u68c0\u7d22\u4e0e\u56fd\u5bb6\u8ffd\u6eaf\u7801\u4e00\u952e\u6838\u9a8c](#33-\u836f\u54c1\u68c0\u7d22\u4e0e\u56fd\u5bb6\u8ffd\u6eaf\u7801\u4e00\u952e\u6838\u9a8c)\n   - 3.4 [\u7535\u5b50\u5904\u65b9\u5355\u667a\u80fd\u7ba1\u7406\u4e0e\u8ffd\u6eaf\u7801 1:1 \u9010\u76d2\u5408\u89c4\u91c7\u96c6](#34-\u7535\u5b50\u5904\u65b9\u5355\u667a\u80fd\u7ba1\u7406\u4e0e\u8ffd\u6eaf\u7801-11-\u9010\u76d2\u5408\u89c4\u91c7\u96c6)\n   - 3.5 [\u8d2d\u7269\u8f66\u6d41\u8f6c\u4e0e\u4ef7\u683c\u52a8\u6001\u8054\u5 533a**\uff1a\u52a0\u7c97\u653e\u5927\u5c55\u793a\u3010\u987e\u5ba2\u59d3\u540d\u3011\uff08\u5982\u201c\u738b*\u660e\u201d\uff09\uff0c\u7d27\u968f\u3010\u6027\u522b\u00b7\u5e74\u9f84\u3011\u6d45\u84dd\u80f6\u56ca\uff08\u5982\u201c\u7537\u00b746\u5c81\u201d\uff09\uff0c\u53f3\u4fa7\u5c55\u793a\u8131\u654f\u8054\u7cfb\u7535\u8bdd\uff1b\n  2. **\u8bca\u65ad\u6838\u5fc3\u533a**\uff1a\u72ec\u5360\u901a\u680f\u6d45\u84dd\u9ad8\u4eae\u5e95\u6846\u5c55\u793a\u3010\u5904\u65b9\u8bca\u65ad\u3011\uff08\u5982\u201c\u6025\u6027\u652f\u6c14\u7ba1\u708e\u4f34\u652f\u539f\u4f53\u611f\u67d3\u201d\uff09\uff0c\u4fbf\u4e8e\u836f\u5e08\u5feb\u901f\u5ba1\u65b9\u6838\u5bf9\uff1b\n  3. **\u6b21\u8981\u5f52\u6863\u533a**\uff1a\u5904\u65b9\u5355\u53f7\u4e0e\u5c31\u8bca\u79d1\u5ba4\u4f4d\u4e8e\u5361\u7247\u5e95\u90e8\u6d45\u7070\u8272\u5fae\u7f29\u5448\u73b0\uff1b\n- **\u591a\u5904\u65b9\u5355\u7d2f\u52a0\u63d0\u5355**\uff1a\n  - \u652f\u6301\u6536\u94f6\u5458\u8fde\u7eed\u63d0\u53d6\u591a\u5f20\u5904\u65b9\u5355\uff0c\u6240\u6709\u5904\u65b9\u836f\u54c1\u5408\u5e76\u7d2f\u52a0\u8fdb\u8d2d\u7269\u8f66\u8fdb\u884c\u5408\u5e76\u7ed3\u7b97\uff1b\n- **1:1 \u9010\u76d2\u5f3a\u91c7\u96c6\u4e0e\u95ed\u73af\u62e6\u622a**\uff1a\n  - \u63d0\u53d6\u5904\u65b9\u5355\u540e\u81ea\u52a8\u89e6\u53d1\u3010\u5904\u65b9\u836f\u54c1\u8ffd\u6eaf\u7801\u91c7\u96c6\u3011\u534a\u7a97\uff1b\n  - \u5904\u65b9\u5305\u542b\u51e0\u76d2\u836f\uff0c\u5fc5\u987b\u901a\u8fc7\u3010\ud83d\udcf8 \u626b\u63cf\u4e00\u76d2\u8ffd\u6eaf\u7801\u3011\u9010\u76d2\u626b\u9f50 20 \u4f4d\u7801\uff08\u5982 `2/2 \u76d2`\uff09\uff1b\n  - **\u5408\u89c4\u62e6\u622a\u673a\u5236**\uff1a\u82e5\u672a\u91c7\u9f50\uff0c\u5e95\u90e8\u4e3b\u6536\u94f6\u6309\u94ae\u663e\u793a\u6a59\u8272\u8b66\u793a\u6001 `\u5f85\u91c7\u8ffd\u6eaf\u7801 (X/Y)`\uff0c\u70b9\u51fb\u5f3a\u5236\u5f39\u51fa\u91c7\u96c6\u7a97\uff0c\u9501\u5b9a\u7ed3\u7b97\u901a\u9053\u76f4\u81f3\u5168\u6570\u91c7\u9f50\u3002\n\n![\u56fe 3-5 \u8282\u70b9 3.3\uff1a\u63d0\u53d6\u5904\u65b9\u5355\ 361\u7247\u65e0\u611f\u9690\u85cf\uff0c\u6536\u94f6\u5458\u53ea\u80fd\u9009\u805a\u5408\u6536\u6b3e\u6216\u73b0\u91d1\u3002 |\n| **\u5df2\u63d0\u5355\u5904\u65b9\u91cd\u590d\u63d0\u53d6** | \u5904\u65b9\u5217\u8868\u670d\u52a1\u7aef\u4ec5\u8fd4\u56de PENDING \u5355\u636e\u3002 | \u5217\u8868\u4e2d\u4e0d\u53ef\u89c1\u5df2\u63d0\u53d6\u5355\u636e\uff0c\u9632\u6b62\u540c\u4e00\u5f20\u5904\u65b9\u6d41\u51fa\u4e24\u6279\u5b9e\u7269\u836f\u3002 |\n| **\u7a7a\u8d2d\u7269\u8f66\u8bef\u89e6\u6536\u6b3e** | \u5e95\u90e8\u6536\u94f6\u6309\u94ae\u5f3a\u5236\u8bbe\u7f6e disabled \u5c5e\u6027\u3002 | \u6309\u94ae\u7f6e\u7070\u4e0d\u53ef\u70b9\u51fb\uff0c\u907f\u514d\u751f\u6210 0 \u5143\u810f\u6570\u636e\u6d41\u6c34\u3002 |\n";
    const STORAGE_KEY = "VITALITY_POS_PRD_MD_V1";
    const editor = document.getElementById("mdEditor");
    const preview = document.getElementById("previewContent");
    const charCount = document.getElementById("charCountText");
    const saveStatus = document.getElementById("saveStatusIndicator");

    function init() {
      const saved = localStorage.getItem(STORAGE_KEY);
      editor.value = saved || DEFAULT_MD;
      renderPreview();
    }

    function onEditorInput() {
      localStorage.setItem(STORAGE_KEY, editor.value);
      saveStatus.textContent = "● 已实时保存至浏览器缓存";
      saveStatus.style.color = "#52c41a";
      renderPreview();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function renderMarkdown(md) {
      // 提取代码块
      const codeBlocks = [];
      let text = md.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, function(match, lang, code) {
        const id = "CODEBLOCK_" + codeBlocks.length + "_PLACEHOLDER";
        codeBlocks.push('<pre><code class="language-' + lang + '">' + escapeHtml(code.trim()) + '</code></pre>');
        return id;
      });

      // 转义普通文本
      text = escapeHtml(text);

      // 行内代码
      text = text.replace(/`([^`]+)`/g, "<code>$1</code>");

      // 标题
      text = text.replace(/^### (.*$)/gim, "<h3>$1</h3>");
      text = text.replace(/^## (.*$)/gim, "<h2>$1</h2>");
      text = text.replace(/^# (.*$)/gim, "<h1>$1</h1>");

      // 粗体和斜体
      text = text.replace(/\*\*([^\*]+)\*\*/g, "<strong>$1</strong>");
      text = text.replace(/\*([^\*]+)\*/g, "<em>$1</em>");

      // 引用
      text = text.replace(/^\> (.*$)/gim, "<blockquote>$1</blockquote>");

      // 列表
      text = text.replace(/^\- (.*$)/gim, "<li>$1</li>");
      text = text.replace(/(<li>.*<\/li>)/s, "<ul>$1</ul>");

      // 表格简易渲染
      const lines = text.split("\n");
      let inTable = false;
      let tableHtml = "";
      let newLines = [];

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (line.startsWith("|") && line.endsWith("|")) {
          if (!inTable) {
            inTable = true;
            tableHtml = "<table>";
          }
          const cells = line.split("|").slice(1, -1).map(c => c.trim());
          if (cells.every(c => c.match(/^:?-+:?$/))) {
            continue;
          }
          const isHeader = !tableHtml.includes("<tr>");
          const tag = isHeader ? "th" : "td";
          tableHtml += "<tr>" + cells.map(c => "<" + tag + ">" + c + "</" + tag + ">").join("") + "</tr>";
        } else {
          if (inTable) {
            tableHtml += "</table>";
            newLines.push(tableHtml);
            inTable = false;
          }
          newLines.push(lines[i]);
        }
      }
      if (inTable) {
        tableHtml += "</table>";
        newLines.push(tableHtml);
      }
      text = newLines.join("\n");

      // 段落换行
      text = text.replace(/\n\n+/g, "</p><p>");
      let res = "<p>" + text + "</p>";

      // 还原代码块
      codeBlocks.forEach(function(block, idx) {
        res = res.replace("CODEBLOCK_" + idx + "_PLACEHOLDER", block);
      });

      return res;
    }

    function renderPreview() {
      charCount.textContent = editor.value.length + " 字符";
      preview.innerHTML = renderMarkdown(editor.value);
    }

    function setViewMode(mode) {
      const editorPane = document.getElementById("editorPane");
      const previewPane = document.getElementById("previewPane");
      document.querySelectorAll(".view-toggle-btn").forEach(b => b.classList.remove("active"));

      if (mode === "split") {
        editorPane.style.display = "flex";
        previewPane.style.display = "flex";
        editorPane.style.flex = "1";
        previewPane.style.flex = "1";
        document.getElementById("btnSplit").classList.add("active");
      } else if (mode === "edit") {
        editorPane.style.display = "flex";
        previewPane.style.display = "none";
        editorPane.style.flex = "1";
        document.getElementById("btnEdit").classList.add("active");
      } else if (mode === "preview") {
        editorPane.style.display = "none";
        previewPane.style.display = "flex";
        previewPane.style.flex = "1";
        document.getElementById("btnPreview").classList.add("active");
      }
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2000);
    }

    function copyMarkdown() {
      navigator.clipboard.writeText(editor.value).then(() => {
        showToast("已成功复制全部 Markdown 文本！");
      });
    }

    function downloadMarkdown() {
      const blob = new Blob([editor.value], { type: "text/markdown;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "店内收银产品需求文档_PRD.md";
      a.click();
      showToast("已触发保存最新【店内收银产品需求文档_PRD.md】！");
    }

    function openWordPrompt() {
      alert("Word 格式文档已在本地生成！文件名为：\n【店内收银产品需求文档_PRD.docx】\n\n可直接双击使用 Microsoft Word 或 WPS Office 打开自由编辑。");
    }

    function resetInitial() {
      if (confirm("确定要将文档重置为系统初始标准 PRD 吗？")) {
        editor.value = DEFAULT_MD;
        localStorage.removeItem(STORAGE_KEY);
        renderPreview();
        showToast("已重置为初始标准 PRD！");
      }
    }

    window.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "s") {
        e.preventDefault();
        localStorage.setItem(STORAGE_KEY, editor.value);
        showToast("已快捷保存至本地缓存！点击【保存下载 MD】可另存文件");
      }
    });

    init();
  </script>
</body>
</html>
